[package]
name = "component-templates"
version = "0.1.16"
edition = "2024"
license = "MIT"
rust-version = "1.91"
description = "Greentic component component-templates"
repository = "https://github.com/component-templates"
build = "build.rs"
authors = [
    "maarten",
]

[package.metadata.component]
package = "greentic:component"

[package.metadata.component.target]
world = "greentic:component/component-v0-v6-v0@0.6.0"

[lib]
crate-type = [
    "cdylib",
    "rlib",
]

[dependencies]
serde_json = "1"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
serde_json = "1"

[build-dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"

[target."cfg(target_arch = \"wasm32\")".dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"

[target."cfg(target_arch = \"wasm32\")".dependencies.wit-bindgen]
version = "0.53"
default-features = false
features = [
    "macros",
    "realloc",
]
